### model
model_name_or_path: google/gemma-7b-it
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all

### dataset
dataset: xfact_train_data_with_context_semantic_chunked_retrieved_evidence
template: gemma
cutoff_len: 10000
# max_samples: 1000        # Optional: enable for quick test only
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### output
output_dir: saves/gemma_7b_xfact_context_semantic_chunking_evidences/lora/sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none
run_name: gemma_7b_xfact_context_semantic_chunking_evidences_lora

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: /data4/babu/Multilingual_factchecking/LLaMA-Factory/saves/gemma_7b_xfact_context_semantic_chunking_evidences/lora/sft/checkpoint-3570
# seed: 26

